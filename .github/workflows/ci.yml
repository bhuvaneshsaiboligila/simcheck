name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - run: pnpm install --frozen-lockfile

      - name: Install gmsh
        # Pinned to 4.15.2 (decisions.md #37) -- apt's packaged gmsh
        # (4.8.4 on ubuntu-latest) meshes the same .geo differently, so
        # the benchmark/higher-order meshes regenerated below silently
        # stopped matching tests/reference/*.json's checkMesh data, which
        # was captured against 4.15.2. pip install matches the version
        # meshes/README.md documents for local regeneration. libglu1-mesa
        # is a runtime dependency of the pip wheel's bundled shared
        # library (apt's gmsh package pulled this in automatically as a
        # transitive dependency; pip's standalone wheel does not).
        run: |
          sudo apt-get update && sudo apt-get install -y libglu1-mesa
          pip install --user --break-system-packages gmsh==4.15.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate benchmark meshes
        # meshes/README.md's documented commands; these two .msh files are
        # gitignored (regenerated, not committed) and feed
        # packages/core/test/metrics.test.ts and findings.test.ts's
        # milestone-7/8 gate assertions, which it.skip themselves when the
        # files are absent -- without this step CI silently skips those
        # tests instead of running them.
        run: |
          cd meshes
          gmsh bench-cube.geo -3 -format msh41 -clmax 0.0355 -o bench-100k.msh
          gmsh bench-cube.geo -3 -format msh41 -clmax 0.0165 -o bench-1m.msh

      - name: Generate clean higher-order meshes
        # decisions.md #31: the higher-order checkMesh-comparison gate
        # (metrics.test.ts's higherOrderCases). meshes/cylinder_3d.msh is
        # NOT generated here -- it's a real externally-sourced file, not
        # regenerable from a .geo. Its defect-detection smoke test
        # (findings.test.ts) correctly skips (via it.skip) when the file
        # is absent, which it always will be in CI.
        run: |
          cd meshes
          gmsh bench-cube.geo -3 -order 2 -clmax 0.3 -format msh2 -o clean-order2.msh
          gmsh bench-cube.geo -3 -order 3 -clmax 0.3 -format msh2 -o clean-order3.msh

      - run: pnpm -r typecheck

      - run: pnpm test

      - run: pnpm -r build
